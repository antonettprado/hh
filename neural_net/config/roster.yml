models:
  - name: 'multi_HH_ttbar_tW_3j'
    model_type: 'multi'
    classification: {
      "HH": ["ggHH_kl_1_kt_1_bbww", "ggHH_kl_2p45_kt_1_bbww", "ggHH_kl_5_kt_1_bbww", "ggHH_kl_0_kt_1_bbww"], 
      "ttbar": ["ttbar"], 
      "tW": ["tW"]}
    process_sf: {
      "ggHH_kl_1_kt_1_bbww": 0.25, 
      "ggHH_kl_2p45_kt_1_bbww": 0.25, 
      "ggHH_kl_5_kt_1_bbww": 0.25, 
      "ggHH_kl_0_kt_1_bbww": 0.25, 
      "ttbar": 8.0, 
      "tW": 4.0}
    batch_size: 1024
    tree_names: ['SL_3j_resolved']
    features: *SL_3j_resolved_vars
    network:
      units: 256
      resnet: True
      act_regularizer: {l1: 1e-4}
    optimizer: {name: 'adam', lr: 0.001}
    epochs: 1000
    data_split: {'train': 0.6, 'val': 0.2, 'test': 0.2}
    process_num_events: {"ttbar": 8_000_000, "tW": 4_000_000}

