  'lep0_pt', 'lep0_phi', 'lep0_eta', 'lep0_iso',                        # low-level
  'all_sT', 'all_mInv', 'all_mT', 'all_jets_HT', 'all_pt', 'era',      # high-level
  'bjets_mbb', 'bjets_dPhi', 'bjets_dEta', 'bjets_dR', 'bjets_pt_bb',   # high-level 5
