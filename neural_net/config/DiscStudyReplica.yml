models:
  - name: 'multi_HH_ttbar_tW_vars'
    model_type: 'multi'
    classification:
      HH: [HH_bbWW]
      TTbar: [TTbar]
      tW: [tW]
    process_sf: 
      HH_bbWW: 1.0
      TTbar: 8.0
      tW: 4.0
    batch_size: 1024
    tree_names: *tree_sel_names
    features: *vars
    network:
      units: 256
      resnet: True
      act_regularizer: {l1: 1e-4}
    optimizer: {name: 'adam', lr: 0.001}
    epochs: 1000
    data_split: {'train': 0.6, 'val': 0.2, 'test': 0.2}

  - name: 'multi_HH_ttbar_tW_lrs'
    model_type: 'multi'
    classification:
      HH: [HH_bbWW]
