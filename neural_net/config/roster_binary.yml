SL_4j_resolved_vars: &SL_4j_resolved_vars [
  'met_pt', 'met_phi', 'nAK4_btag', 'ak4_jet0_pt', 'ak4_jet0_phi', 'ak4_jet0_eta', 'ak4_jet0_bscore', 'ak4_jet1_pt', 'ak4_jet1_phi', 'ak4_jet1_eta', 'ak4_jet1_bscore', 'ak4_jet2_pt', 'ak4_jet2_phi', 'ak4_jet2_eta', 'ak4_jet2_bscore', 
  'lep0_pt', 'lep0_phi', 'lep0_eta', 'lep0_iso', 
  'blnu_mT', 'blnu_pt', 'blnu_bl_mInv', 'blnu_lnu_mT',
  'all_sT', 'all_mInv', 'all_mT', 'all_jets_HT', 'all_pt', 'era',
  'bjets_mbb', 'bjets_dPhi', 'bjets_dEta', 'bjets_dR', 'bjets_pt_bb', 'bb_lnu_dPhi', 'min_b_l_dPhi', 'min_b_l_dR', 'min_b_lnu_dPhi', 
  'ak4_jet3_pt', 'ak4_jet3_phi', 'ak4_jet3_eta', 'ak4_jet3_bscore', # For 4j only
  'mjj', 'WW_mInv', 'WW_mT', 'WW_pt',                               # For 4j only
  'jj_l_dPhi', 'jj_l_dR', 'jj_lnu_dPhi',                            # For 4j only
  'trijet_mInv', 'trijet_pt', 'trijet_pt_rat', 'trijet_bijet_dR', 'trijet_bijet_dPhi', 'trijet_bijet_dEta', 'bjet_bijet_dR', 'bjet_bijet_dPhi', 'bjet_bijet_dEta' # For 4j only
  ]

classification1: &classification1 {
    "ttbar": ["ttbar"], 
    "non_ttbar": [
      "ggHH_kl_1_kt_1_bbww", 
      "ggHH_kl_2p45_kt_1_bbww", 
      "ggHH_kl_5_kt_1_bbww", 
      "ggHH_kl_0_kt_1_bbww",
      "tW"
    ]
  }
    
models:
  - name: 'binary_test'
    model_type: 'binary'
    classification: *classification1
    process_sf: {
      "ggHH_kl_1_kt_1_hh_bbww": 1.0, 
      "ggHH_kl_2p45_kt_1_hh_bbww": 1.0, 
      "ggHH_kl_5_kt_1_hh_bbww": 1.0, 
      "ggHH_kl_0_kt_1_hh_bbww": 1.0,
      "tW": 4.0, 
      "ttbar": 8.0}
    batch_size: 1024
    tree_names: ['SL_res_4j_1b', 'SL_res_4j_2b']
    features: *SL_4j_resolved_vars
    network:
      units: 32
      resnet: True
      act_regularizer: {l1: 1e-4}
    optimizer: {name: 'adam', lr: 0.001}
    epochs: 20
    process_num_events: {
      "ttbar": 10_000, 
      "tW": 500,
      "ggHH_kl_1_kt_1_hh_bbww": 100, 
      "ggHH_kl_2p45_kt_1_hh_bbww": 100, 
