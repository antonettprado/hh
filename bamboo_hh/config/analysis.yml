tree: Events

eras:
  '2022':
    luminosity: 7980.4
  2022EE:
    luminosity: 26671.7
  '2023':
    luminosity: 17794 # pb^-1
  "2023BPix":
    luminosity:  9451 #pb^-1

samples: !include [
  2022_mc.yml,
  2023_mc.yml,
  ]

plotIt:
  configuration:
    width: 800
    height: 600
    margin-left: 0.2
    margin-right: 0.03
    margin-top: 0.05
    margin-bottom: 0.15
    luminosity-label: '%1$.2f fb^{-1} (13.6 TeV)'
    experiment: CMS
    extra-label: Run 3 - Work in progress
    error-fill-style: 3154
    error-fill-color: '#ee556270'
    ratio-fit-error-fill-style: 1001
    ratio-fit-error-fill-color: '#aa556270'
    ratio-fit-line-color: '#0B486B'
    yields-table-align: v
  legend:
    position:
    - 0.7
    - 0.6
    - 0.91
    - 0.91
  groups:
    data:
      legend: data
    ggHH_kl_1_kt_1_bbww:
      legend: ggHH_bbWW
      fill-color: '#EDC951'
    ggHH_kl_1_kt_1_bbtautau:
      legend: ggHH_bbtautau
      fill-color: '#EDC951'
    HH_bbtautau:
      legend: HH_bbtautau
      fill-color: '#EDC951'
    ttbar:
      legend: ttbar
      fill-color: '#99ccff'
    DY:
      legend: DY
      fill-color: '#9FFF33'
    WJets:
      legend: WJets
      fill-color: '#FFC300'
    VV:
      legend: VV
      fill-color: '#C900FF'
    tW:
      legend: tW
      fill-color: '#BB2255'
    single_top:
      legend: single_top
      fill-color: '#BB2255'
    QCD:
      legend: QCD
      fill-color: '#AB2255'
    ggH:
      legend: ggH
      fill-color: '#AB0055'
    VBFH:
      legend: VBFH
      fill-color: '#AB0055'
    WH:
      legend: WH
      fill-color: '#AB0055'
    ZH:
      legend: ZH
      fill-color: '#AB0055'
    ttH:
      legend: ttH
      fill-color: '#AB1155'
  plotdefaults:
    y-axis: Events
    y-axis-show-zero: true
    save-extensions:
    - pdf
    show-ratio: true
    sort-by-yields: true
    legend-columns: 2
    ratio-y-axis: '#frac{Data}{MC}'
    ratio-y-axis-range:
    - 0.5
    - 1.5
    normalized: false

