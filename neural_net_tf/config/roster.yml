  batch_size: 1024
  tree_names: ['SL_resolved']
  features: ['met_pt', 'met_phi', 'nAK4', 'nAK4_btag', 'ak4_jet0_pt', 'ak4_jet0_phi', 'ak4_jet0_eta', 'ak4_jet0_bscore', 'ak4_jet1_pt', 'ak4_jet1_phi', 'ak4_jet1_eta', 'ak4_jet1_bscore', 'ak4_jet2_pt', 'ak4_jet2_phi', 'ak4_jet2_eta', 'ak4_jet2_bscore', 'ak4_jet3_pt', 'ak4_jet3_phi', 'ak4_jet3_eta', 'ak4_jet3_bscore', 'lep0_pt', 'lep0_phi', 'lep0_eta', 'lep0_iso', 'trijet_mInv', 'trijet_pt', 'trijet_pt_rat', 'blnu_mT', 'blnu_pt', 'trijet_bijet_dR', 'trijet_bijet_dPhi', 'trijet_bijet_dEta', 'bjet_bijet_dR', 'bjet_bijet_dPhi', 'bjet_bijet_dEta', 'all_sT', 'all_mInv', 'all_mT', 'all_jets_HT', 'all_pt', 'mjj', 'WW_mInv', 'WW_pt', 'bjets_mbb', 'bjets_dPhi', 'bjets_dPhi_abs', 'bjets_dEta', 'bjets_dEta_abs', 'bjets_dR', 'bjets_pt_bb']
