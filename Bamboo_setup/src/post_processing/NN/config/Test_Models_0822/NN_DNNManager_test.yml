  - name: 'multi_HH_ttbar_tW'
    type: 'multi'
    # categorization: {"HH": ["HH_bbWW", "HH_bbtautau"], "ttbar": ["ttbar"], "tW": ["tW"]}
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW": ["tW"]}
    training_weight_sf: {"HH_bbWW": 1.0, "HH_bbtautau": 1.0, "ttbar": 8.0, "tW": 4.0}
    #input_vars: 'All'
    input_vars: ["nAK4", "nAK4_btag", "lep0_pt", "lep0_eta", "lep0_phi", "ak4_jet0_pt", "ak4_jet0_eta", "ak4_jet0_phi", "ak4_jet1_pt", "ak4_jet1_eta", "ak4_jet1_phi", "ak4_jet2_pt", "ak4_jet2_eta", "ak4_jet2_phi", "ak4_btag0_pt", "ak4_btag0_eta", "ak4_btag0_phi", "ak4_btag1_pt", "ak4_btag1_eta", "ak4_btag1_phi", "met_pt", "met_phi", "bjets_mbb", "bjets_dPhi", "bjets_dR", "bjets_pt_bb", "trijet_mInv", "trijet_pt", "trijet_pt_rat", "blnu_mT", "blnu_pt", "trijet_bijet_dR", "trijet_bijet_dPhi", "bjet_bijet_dR", "bjet_bijet_dPhi", "all_pt", "all_mInv", "all_jets_HT"]
    architecture_in_yml: True
    residual_network: True
    layers: 
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
    outputs: 
      - {type: 'Dense', units: 3, kernel_initializer: 'normal', activation: 'softmax', act_regularizer: {l2: 1e-4}, name: 'output'}
    compiler: {optimizer: 'adam', lr: 0.001, loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_HH_ttbar_tW_l1'
    type: 'multi'
    # categorization: {"HH": ["HH_bbWW", "HH_bbtautau"], "ttbar": ["ttbar"], "tW": ["tW"]}
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW": ["tW"]}
    training_weight_sf: {"HH_bbWW": 1.0, "HH_bbtautau": 1.0, "ttbar": 8.0, "tW": 4.0}
    #input_vars: 'All'
    input_vars: ["nAK4", "nAK4_btag", "lep0_pt", "lep0_eta", "lep0_phi", "ak4_jet0_pt", "ak4_jet0_eta", "ak4_jet0_phi", "ak4_jet1_pt", "ak4_jet1_eta", "ak4_jet1_phi", "ak4_jet2_pt", "ak4_jet2_eta", "ak4_jet2_phi", "ak4_btag0_pt", "ak4_btag0_eta", "ak4_btag0_phi", "ak4_btag1_pt", "ak4_btag1_eta", "ak4_btag1_phi", "met_pt", "met_phi", "bjets_mbb", "bjets_dPhi", "bjets_dR", "bjets_pt_bb", "trijet_mInv", "trijet_pt", "trijet_pt_rat", "blnu_mT", "blnu_pt", "trijet_bijet_dR", "trijet_bijet_dPhi", "bjet_bijet_dR", "bjet_bijet_dPhi", "all_pt", "all_mInv", "all_jets_HT"]
    architecture_in_yml: True
    residual_network: True
    layers: 
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l1: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l1: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 256, activation: 'relu', act_regularizer: {l1: 1e-4}, dropout_rate: 0.4}
    outputs: 
      - {type: 'Dense', units: 3, kernel_initializer: 'normal', activation: 'softmax', act_regularizer: {l1: 1e-4}, name: 'output'}
    compiler: {optimizer: 'adam', lr: 0.001, loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}
