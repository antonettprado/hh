Models:  
  - name: 'binary_HH_ttbar_default'
    type: 'multi'
    categorization: {"HH": ["HH_bbWW"], "ttbar": ["ttbar"]}
    training_weight_sf: {"HH": 1.0, "ttbar": 8.0}
    input_vars: 'All'
    architecture_in_yml: True
    residual_network: True
    layers: 
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
    outputs: 
      - {type: 'Dense', units: 2, kernel_initializer: 'normal', activation: 'softmax', act_regularizer: {l2: 1e-4}, name: 'output'}
    compiler: {optimizer: 'adam', lr: 0.001, loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'binary_HH_ttbar_def_tw11'
    type: 'multi'
    categorization: {"HH": ["HH_bbWW"], "ttbar": ["ttbar"]}
    training_weight_sf: {"HH": 1.0, "ttbar": 1.0}
    input_vars: 'All'
    architecture_in_yml: True
    residual_network: True
    layers: 
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
      - {type: 'Dense', units: 32, activation: 'relu', act_regularizer: {l2: 1e-4}, dropout_rate: 0.4}
    outputs: 
      - {type: 'Dense', units: 2, kernel_initializer: 'normal', activation: 'softmax', act_regularizer: {l2: 1e-4}, name: 'output'}
    compiler: {optimizer: 'adam', lr: 0.001, loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}
