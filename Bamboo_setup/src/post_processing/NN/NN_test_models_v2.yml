Models:
  # ==================== Binary Models ====================
  - name: 'binary_HH_ttbar'
    training_processes: ["HH", "ttbar"]
    classes: ["isSignal"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_HH_ttbar_tW'
    training_processes: ["HH", "ttbar", "tW"]
    classes: ["isSignal"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_HH_tW'
    training_processes: ["HH", "tW"]
    classes: ["isSignal"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_All'
    training_processes: ["HH", "ttbar", "tW", "DY", "VV", "WJets"]
    classes: ["isSignal"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_All_4ilayers'
    training_processes: ["HH", "ttbar", "tW", "DY", "VV", "WJets"]
    classes: ["isSignal"]
    input_vars: 'All'
    layers: 
