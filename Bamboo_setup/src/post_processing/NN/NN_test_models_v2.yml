Models:
  # # ==================== Binary Models ====================
  - name: 'binary_HH_ttbar'
    categorization: {"isSignal": ["HH", ttbar]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_HH_ttbar_tW'
    categorization: {"isSignal": ["HH", "ttbar", "tW"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_HH_tW'
    categorization: {"isSignal": ["HH", "tW"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_All'
    categorization: {"isSignal": ["HH", "ttbar", "tW", "DY", "VV", "WJets"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_All_4ilayers'
    categorization: {"isSignal": ["HH", "ttbar", "tW", "DY", "VV", "WJets"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  # # ================= Multiclass Models =================
  - name: 'multi_HH_ttbar_2classes'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 2, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_HH_ttbar_tW_3classes'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW": ["tW"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 3, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_HH_ttbar_DY_3classes'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "Others": ["DY"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 3, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_HH_ttbar_DY_tW_4classes'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW":["tW"], "Others": ["DY"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 4, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_All_4classes'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW":["tW"], "Others": ["DY", "VV", "WJets"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 4, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'multi_All_4classes_4ilayers'
    categorization: {"HH": ["HH"], "ttbar": ["ttbar"], "tW":["tW"], "Others": ["DY", "VV", "WJets"]}
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 4, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}