  - name: 'binary_train_HH_ttbar_tW'
    training_processes: ["HH", "ttbar", "tW"]
    output_processes: ["isSignal"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 1, kernel_initializer: 'normal', activation: 'sigmoid', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 1000, validation_split: 0.25}

  - name: 'binary_train_HH_ttbar_2outputs'
    training_processes: ["HH", "ttbar"]
    output_processes: ["HH", "ttbar"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 2, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

  - name: 'binary_train_HH_ttbar_tW_3outputs'
    training_processes: ["HH", "ttbar", "tW"]
    output_processes: ["HH", "ttbar", "tW"]
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
      - {type: 'Dense', units: 64, activation: 'relu', l2: 1e-6}
    outputs: 
      - {type: 'Dense', units: 3, kernel_initializer: 'normal', activation: 'softmax', l2: 1e-6, name: 'output'}
    compiler: {optimizer: 'adam', loss: 'categorical_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}

