Models:
  - name: 'default'
    input_vars: ['lep0_pt', 'lep0_phi', 'ak4_jet0_pt', 'ak4_jet1_pt', 'bjets_mbb', 'trijet_mInv']
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu'}
      - {type: 'Dense', units: 64, activation: 'relu'}
      - {type: 'Dense', units: 64, activation: 'relu'}
    output: {type: 'Dense', units: 1, activation: 'sigmoid'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}
  - name: 'model1'
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu'}
      - {type: 'Dense', units: 32, activation: 'relu'}
      - {type: 'Dense', units: 10, activation: 'softmax'}
    output: {type: 'Dense', units: 1, activation: 'sigmoid'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}
  - name: 'model2'
    input_vars: 'All'
    layers: 
      - {type: 'Dense', units: 64, activation: 'relu'}
      - {type: 'Dense', units: 64, activation: 'relu'}
      - {type: 'Dense', units: 64, activation: 'relu'}
    output: {type: 'Dense', units: 1, activation: 'sigmoid'}
    compiler: {optimizer: 'adam', loss: 'binary_crossentropy'}
    fit: {batch_size: 512, epochs: 50, validation_split: 0.25}
    fit: {batch_size: 1024, epochs: 100, validation_split: 0.25}